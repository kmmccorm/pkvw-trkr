<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bus Arrivals</title>
<!-- No inline script or style anywhere in this file: the server sends a
     Content-Security-Policy that allows neither. Logic is in app.js and
     countdown.js, styling in style.css. -->
<link rel="stylesheet" href="/style.css" />
</head>
<body data-view="notice">
  <header>
    <h1>Departures · California &amp; North</h1>
    <div id="clock"></div>
  </header>

  <main>
    <!-- One column per watched route, in the order they should appear.
         data-rt must match src/config.ts DEFAULT_WATCH. The direction and
         sub-label are static because each route is pinned to one stop. -->
    <section class="route" data-rt="72">
      <div class="route-head">
        <div class="flap digit">7</div>
        <div class="flap digit">2</div>
        <div class="flap route-label">
          <div class="dir">Eastbound</div>
          <div class="sub">North Ave · to Clark</div>
        </div>
      </div>
      <div class="slots"></div>
    </section>

    <section class="route" data-rt="94">
      <div class="route-head">
        <div class="flap digit">9</div>
        <div class="flap digit">4</div>
        <div class="flap route-label">
          <div class="dir">Northbound</div>
          <div class="sub">California · to Addison</div>
        </div>
      </div>
      <div class="slots"></div>
    </section>

    <div id="notice" class="flap">Connecting&hellip;</div>
  </main>

  <footer><span id="dot"></span><span id="status">Starting up</span></footer>

<script type="module" src="/app.js"></script>
</body>
</html>
