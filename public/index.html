<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bus Arrivals</title>
<!-- No inline script or style anywhere in this file: the server sends a
     Content-Security-Policy that allows neither. Logic is in app.js and
     countdown.js, styling in style.css. -->
<link rel="stylesheet" href="/style.css" />
</head>
<body data-view="notice">
  <header>
    <h1>Bus Arrivals</h1>
    <div id="clock"></div>
  </header>

  <main>
    <table>
      <colgroup>
        <col class="route" />
        <col class="dir" />
        <col class="time" />
        <col class="mins" />
      </colgroup>
      <thead>
        <tr>
          <th>Route</th>
          <th>Direction</th>
          <th>Time</th>
          <th class="mins">Minutes Until</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="notice">Connecting&hellip;</div>
  </main>

  <footer><span id="dot"></span><span id="status">Starting up</span></footer>

<script type="module" src="/app.js"></script>
</body>
</html>
